# BODDOS node configuration.
# Copy to boddos.yaml on each machine and edit per-node.

node:
  # Unique short id per machine, e.g. "macbook", "zbook", "hp".
  id: "macbook"
  name: "MacBook (primary host)"
  # role: "host" (runs models) or "edge" (light routing / sensors / tools)
  role: "host"
  bind_host: "0.0.0.0"
  bind_port: 8787
  # Advertised URL other nodes reach this machine at. Leave blank to
  # auto-detect this machine's real LAN IP at startup (boddos/netutil.py)
  # — only set this explicitly if auto-detection picks the wrong interface
  # or you're reaching this node through a different address (e.g. a
  # Tailscale/Headscale hostname).
  advertise_url: ""

assistant:
  # What you call your assistant, and the wake phrases that activate it hands-free.
  name: "Ori"
  wake_words: ["ori", "hey ori"]
  greeting: "Yes?"

mesh:
  # Shared secret — every node in your mesh must use the same value.
  # Requests between nodes must present this. Generate a long random string.
  psk: "CHANGE-ME-to-a-long-random-shared-secret"
  # Peer node URLs to say hello to on startup (LAN IPs).
  peers:
    - "http://192.168.1.11:8787"   # ZBook (failover host)
    - "http://192.168.1.12:8787"   # HP (edge/tools)
  heartbeat_seconds: 10

models:
  # Local model provider. Point at the Ollama instance on this machine.
  provider: "ollama"
  ollama_url: "http://127.0.0.1:11434"
  # Default advisor model (must be pulled locally: `ollama pull llama3.1`).
  default_model: "llama3.1"
  # Multimodal model for camera vision (`ollama pull llava`).
  vision_model: "llava"
  # No ram_gb/has_gpu here to set — the node detects its own CPU/RAM/GPU
  # at startup (see /api/hardware) and uses that for mesh routing instead.

agent:
  # OS agent runs tasks on THIS machine only. Off by default; opt in per node.
  enabled: false
  # Only these commands (by first token) may be run. Keep it tight.
  allowed_commands: ["ls", "cat", "echo", "df", "uptime", "git", "python3"]
  # Working directory the agent is confined to.
  workdir: "~/boddos-agent"
  # Require an explicit confirm flag on each run request.
  require_confirm: true

screen:
  # Screenshot + click/type control of THIS machine's own display, gated
  # behind the local vision model. Off by default; needs `pip install
  # 'boddos[screen]'` and a real display (not a headless server).
  enabled: false
  require_confirm: true
  # Falls back to models.vision_model when blank.
  vision_model: ""
  # The autonomous drive_screen loop (perceive -> decide -> act) runs at
  # full speed with no added delay by default, capped at this many steps
  # per request. A voice/chat request can still ask it to go slow to watch.
  max_drive_steps: 12
  # A drive step that looks financial or destructive (pay, delete, sudo, ...)
  # always pauses for an explicit human "yes" first, regardless of speed.
  require_confirm_for_sensitive: true

ogun:
  # Ogun 3D's building tools: OpenSCAD modeling, Cantera combustion checks,
  # ngspice circuit simulation. On by default — pure geometry/chemistry/
  # circuit compute, not OS/file access, so it doesn't need the same
  # confirm-gating as agent/screen. Needs `pip install 'boddos[ogun]'`
  # plus `apt install openscad xvfb ngspice`.
  enabled: true
  workdir: "~/.boddos/ogun"
  max_source_chars: 20000
  render_timeout_s: 25.0
  chemistry_mechanism: "gri30.yaml"
  # Free key from materialsproject.org/api — falls back to $MP_API_KEY.
  # Material lookup fails cleanly with no key configured; nothing else here needs one.
  materials_api_key: ""

skills:
  # The Skill Portal (Orunmila's "new wishes"): fetch an open-source repo,
  # compress it with RepoMix, security-gate any code with AST + Bandit,
  # save it as a manifest-described tool other panels render and run in
  # one click with no further model call. Needs `pip install
  # 'boddos[skills]'` (Bandit) and Node/npx (already required by the
  # frontend) for RepoMix.
  enabled: true
  # Saving still requires this even though the scan already ran — static
  # analysis is a real check, not a guarantee.
  require_confirm: true
  workdir: "~/.boddos/workspace_skills"
  max_repo_files: 400
  max_compressed_chars: 60000
  fetch_timeout_s: 45.0
  run_timeout_s: 20.0

services:
  weather:
    enabled: true
    # Default location for weather-aware planning (lat, lon).
    lat: 40.7128
    lon: -74.0060
  translate:
    enabled: true
    # Uses the local model to translate any language -> English.
    model: "llama3.1"
  calling:
    enabled: false
    provider: "none"   # plug in your own provider adapter
  routing:
    # Esu Pathfinder: geocoding + turn-by-turn directions to a named
    # destination. Public OSM demo services by default (best-effort,
    # rate-limited) — point these at a self-hosted Nominatim/OSRM for
    # real use.
    enabled: true
    nominatim_url: "https://nominatim.openstreetmap.org"
    osrm_url: "https://router.project-osrm.org"
  finder:
    # Lost-device finder: BLE proximity ("getting warmer/colder") for a
    # device you already own and paired — not a lookup tool for anyone
    # else's. Needs a BLE radio + `pip install 'boddos[finder]'`.
    enabled: true
  drone:
    enabled: false
    # e.g. "udp:127.0.0.1:14550" for a MAVLink endpoint you control
    endpoint: ""
  notify:
    # Delivers duress/dead-man alerts to trusted_contacts by their channel.
    enabled: true
    # SMS gateway URL template you control; {target} and {body} are substituted.
    sms_webhook: ""
    smtp:
      host: ""            # e.g. "smtp.gmail.com"
      port: 587
      username: ""
      password: ""        # prefer env BODDOS_SMTP_PASSWORD
      from_addr: ""
      use_tls: true
  push:
    # Web Push so duress alerts hit the phone lock screen.
    # Needs `pip install 'boddos[push]'`; generate keys: `python -m boddos --new-vapid`
    enabled: false
    vapid_public: ""
    vapid_private: ""
    subject: "mailto:you@example.com"
    store_file: "~/.boddos/push_subs.json"

safety:
  # People to alert in a panic/duress event. YOUR contacts, consenting.
  trusted_contacts:
    - name: "Alex"
      channel: "sms"        # sms | email | webhook
      target: "+15555550123"
  # Broadcast an alert event on the mesh bus when duress is triggered.
  broadcast: true
  # Tracker detection: flag an unknown BLE device seen following you
  # across this many distinct locations/time windows.
  tracker_follow_threshold: 3
  # Geofenced zones. "safe" = expected; leaving all safe zones raises an alert.
  # "danger" = entering raises an alert. Pair with the dead-man's switch.
  geofences:
    - name: "home"
      lat: 40.7128
      lon: -74.0060
      radius_m: 150
      kind: "safe"

security:
  # Require a bearer token for the phone/UI API. If enabled with no api_token,
  # one is generated and printed at startup (also settable via BODDOS_API_TOKEN).
  require_auth: false
  api_token: ""
  # Serve HTTPS with a self-signed cert (auto-generated if missing). Trust it
  # once on your phone, or use a WireGuard overlay for remote access.
  tls_enabled: false
  tls_cert: "~/.boddos/cert.pem"
  tls_key: "~/.boddos/key.pem"
  # Abuse / brute-force protection.
  rate_per_sec: 5.0
  rate_burst: 20.0
  lockout_threshold: 8
  lockout_seconds: 300
  # Tamper-evident audit log of sensitive actions (hash-chained).
  audit_log: "~/.boddos/audit.log"
  # Encrypted secret vault (unlock at runtime via BODDOS_VAULT_PASSPHRASE).
  vault_file: "~/.boddos/vault.bin"
  # Optional TOTP 2FA on sensitive actions (agent, drone, vault writes).
  # Provision a secret: `python -m boddos --new-totp`
  require_2fa: false
  totp_secret: ""         # base32; or set env BODDOS_TOTP_SECRET
