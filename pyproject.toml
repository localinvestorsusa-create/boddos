[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "boddos"
version = "0.1.0"
description = "Backbone for On-Device Distributed Operations & Safety — a private, self-hosted personal AI + safety assistant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "psutil>=5.9",
    "py-cpuinfo>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.20"]
push = ["pywebpush>=1.14"]
mavlink = ["pymavlink>=2.4"]
screen = ["pyautogui>=0.9.54"]
finder = ["bleak>=0.21"]
skills = ["bandit>=1.7"]
ogun = [
    "cantera>=3.0", "PySpice>=1.5", "rocketpy>=1.0",
    "openmm>=8.0", "biopython>=1.83", "mp-api>=0.41",
]

[project.scripts]
boddos = "boddos.__main__:main"

[tool.setuptools.packages.find]
include = ["boddos*"]

[tool.setuptools.package-data]
boddos = ["ui/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
