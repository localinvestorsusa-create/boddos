[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "boddos"
version = "0.1.0"
description = "BODDOS — minimal skeleton, backend + frontend connected, ready for new instructions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
boddos = "boddos.__main__:main"

[tool.setuptools.packages.find]
include = ["boddos*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
